base: /
dependencies:
  - praxiswissen-typo3/snowboard
errorHandling:
  -
    errorCode: 404
    errorHandler: Page
    errorContentSource: 't3://page?uid=43'
languages:
  -
    title: Deutsch
    enabled: true
    locale: de_DE.utf8
    hreflang: ''
    base: /
    websiteTitle: ''
    navigationTitle: Deutsch
    flag: de
    languageId: 0
  -
    title: Englisch
    enabled: true
    locale: en_US.utf8
    hreflang: ''
    base: /en/
    websiteTitle: 'Snowboard School Meyer, Müller & Schmidt'
    navigationTitle: Englisch
    fallbackType: strict
    fallbacks: '0'
    flag: en-us-gb
    languageId: 1
rootPageId: 14
routeEnhancers:
  PrintView:
    type: PageType
    default: ''
    map:
      .print.html: 1
      sitemap.xml: 1533906435
  Sitemap:
    type: Simple
    routePath: 'sitemap-type/{sitemap}'
    aspects:
      sitemap:
        type: StaticValueMapper
        map:
          pages: pages
  News:
    type: Extbase
    limitToPages:
      - 40
    extension: News
    plugin: Pi1
    routes:
      -
        routePath: '/{news-title}'
        _controller: 'News::detail'
        _arguments:
          news-title: news
    aspects:
      news-title:
        type: NewsTitle
websiteTitle: 'Snowboardschule Meyer, Müller & Schmidt'
